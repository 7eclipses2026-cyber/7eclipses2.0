<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJ2KbU4YlhrXz2loHdhC_E8nEXVDIaSwE",
  authDomain: "eclipses-1bf5c.firebaseapp.com",
  projectId: "eclipses-1bf5c",
  storageBucket: "eclipses-1bf5c.appspot.com",
  messagingSenderId: "1073801219283",
  appId: "1:1073801219283:web:3f9d8e1e5f6a7b8c9d0e1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.firebaseAuth = auth;
window.firebaseProvider = provider;

// Login function
window.firebaseLogin = async function(){
  try{
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    localStorage.setItem('7eclipses_user', user.email);
    localStorage.setItem('7eclipses_name', user.displayName);
    localStorage.setItem('7eclipses_photo', user.photoURL);
    updateLoginUI(user);
    document.getElementById('eclipses-login-modal').style.display='none';
    return user;
  }catch(e){
    alert("Login failed: "+e.message+"\n\nFirebase Console > Authentication > Authorized domains me 7eclipses.com add karo");
    console.error(e);
  }
};

window.firebaseLogout = async function(){
  await signOut(auth);
  localStorage.removeItem('7eclipses_user');
  localStorage.removeItem('7eclipses_name');
  localStorage.removeItem('7eclipses_photo');
  document.getElementById('eclipses-login-tab').innerText='LOGIN';
};

function updateLoginUI(user){
  const btn = document.getElementById('eclipses-login-tab');
  if(btn){
    const name = user.displayName ? user.displayName.split(' ')[0].toUpperCase() : user.email.split('@')[0].toUpperCase();
    btn.innerText = 'Hi, '+name.substring(0,8);
  }
  const loginBtn = document.getElementById('login-btn');
  if(loginBtn){
    loginBtn.innerText = 'Hi, '+(user.displayName||user.email).split(' ')[0];
  }
}

onAuthStateChanged(auth, (user)=>{
  if(user) updateLoginUI(user);
});

<div id="eclipses-login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:white; padding:28px; border-radius:20px; width:90%; max-width:360px; text-align:center; font-family:Poppins,sans-serif;">

    <button id="google-login-btn-real" onclick="window.firebaseLogin()" style="margin-top:20px; width:100%; height:48px; border:1px solid #ddd; border-radius:9999px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600;">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18"> Continue with Google
    </button>
    <button onclick="document.getElementById('eclipses-login-modal').style.display='none'" style="margin-top:12px; font-size:12px; color:gray; background:none; border:none; width:100%;">Close</button>
    <p style="font-size:10px; color:#aaa; margin-top:12px;">By continuing, you agree to our Terms</p>
  </div>
</div>
function addLoginTabInHeader(){
  try{
    if(document.getElementById('eclipses-login-tab')) return;
    var header = document.querySelector('header');
    if(!header) return;
    var target = header.querySelector('nav') || header;
    
    var loginTab = document.createElement('button');
    loginTab.id = 'eclipses-login-tab';
    var savedName = localStorage.getItem('7eclipses_name');
    var savedEmail = localStorage.getItem('7eclipses_user');
    loginTab.innerText = savedName ? 'Hi, '+savedName.split(' ')[0].toUpperCase() : (savedEmail ? 'Hi, '+savedEmail.split('@')[0].toUpperCase().substring(0,6) : 'LOGIN');
    loginTab.style.cssText = 'font-family:Bebas Neue,sans-serif; font-size:18px; letter-spacing:1px; padding:8px 16px; border:1px solid black; border-radius:9999px; margin-right:8px; background:white; cursor:pointer;';
    
    loginTab.onclick = function(){
      var modal = document.getElementById('eclipses-login-modal');
      if(modal) modal.style.display='flex';
      else window.firebaseLogin();
    };
    
    if(target.firstChild) target.insertBefore(loginTab, target.firstChild);
    else target.appendChild(loginTab);
    
  }catch(e){ console.log('login error', e); }
}

let obs = new MutationObserver(()=>addLoginTabInHeader());
let h = document.querySelector('header');
if(h) obs.observe(h, {childList:true, subtree:true});
addLoginTabInHeader();
setTimeout(addLoginTabInHeader, 500);
setTimeout(addLoginTabInHeader, 1500);
</script>
