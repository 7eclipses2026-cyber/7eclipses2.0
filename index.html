  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --navy:#04182e;
  --ocean:#0a3d62;
  --teal:#0e7a8a;
  --lav:#b8a9d6;
  --cream:#fffaf0;
  --ink:#071a2e;
  --muted:#5b7186;
  --surface:#ffffff;
  --surface-2:#eef6f8;
  --line:#d9e6ec;
  --gold:#f2c94c;
}

@media (prefers-color-scheme: dark){
  :root{
    --navy:#020f1e;
    --ocean:#0a3d62;
    --teal:#1aa3b5;
    --lav:#c9bde8;
    --cream:#071a2e;
    --ink:#eaf6f8;
    --muted:#a9c2cf;
    --surface:#08243c;
    --surface-2:#0a2f4b;
    --line:#1b435e;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,Segoe UI,sans-serif
}

.font-display{
  font-family:'Fraunces',Georgia,serif
}

a{
  color:inherit
}

button{
  font-family:inherit
}

input,select,textarea{
  font-family:inherit
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-14px) rotate(2deg)
  }
}

@keyframes bubble{
  0%{
    transform:translateY(0) scale(.7);
    opacity:0
  }

  15%{
    opacity:.9
  }

  100%{
    transform:translateY(-260px) scale(1.15);
    opacity:0
  }
}

@keyframes shimmer{
  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.animate-floaty{
  animation:floaty 5s ease-in-out infinite
}

.animate-fadeUp{
  animation:fadeUp .5s ease both
}

.bubble{
  animation:bubble 6s linear infinite
}

.hero-gradient{
  background:linear-gradient(180deg,rgba(4,24,46,.18) 0%,rgba(4,24,46,.62) 72%,#04182e 100%)
}

.ocean-gradient{
  background:linear-gradient(135deg,#04182e 0%,#0a3d62 48%,#0e7a8a 100%)
}

.lav-gradient{
  background:linear-gradient(135deg,#b8a9d6 0%,#e8e0f5 55%,#fffaf0 100%)
}

.tile-shadow{
  box-shadow:0 18px 40px rgba(4,24,46,.14)
}

.chip{
  border:1px solid var(--line);
  background:var(--surface)
}

.placeholder\:text-white\/60::-moz-placeholder{
  color: rgb(255 255 255 / 0.6);
}

.placeholder\:text-white\/60::placeholder{
  color: rgb(255 255 255 / 0.6);
}

.hover\:bg-\[\#eef6f8\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(238 246 248 / var(--tw-bg-opacity, 1));
}

.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}

@media (min-width: 640px){
  .sm\:right-5{
    right: 1.25rem;
  }

  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:mx-6{
    margin-left: 1.5rem;
    margin-right: 1.5rem;
  }

  .sm\:h-11{
    height: 2.75rem;
  }

  .sm\:min-h-\[620px\]{
    min-height: 620px;
  }

  .sm\:w-11{
    width: 2.75rem;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:gap-2{
    gap: 0.5rem;
  }

  .sm\:gap-4{
    gap: 1rem;
  }

  .sm\:gap-5{
    gap: 1.25rem;
  }

  .sm\:gap-8{
    gap: 2rem;
  }

  .sm\:rounded-\[24px\]{
    border-radius: 24px;
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-16{
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:py-20{
    padding-top: 5rem;
    padding-bottom: 5rem;
  }

  .sm\:text-\[10px\]{
    font-size: 10px;
  }

  .sm\:text-\[13px\]{
    font-size: 13px;
  }

  .sm\:text-\[24px\]{
    font-size: 24px;
  }

  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }
}

@media (min-width: 768px){
  .md\:ml-0{
    margin-left: 0px;
  }

  .md\:flex{
    display: flex;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:mx-10{
    margin-left: 2.5rem;
    margin-right: 2.5rem;
  }

  .lg\:flex{
    display: flex;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:w-\[260px\]{
    width: 260px;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.1fr_\.9fr\]{
    grid-template-columns: 1.1fr .9fr;
  }

  .lg\:grid-cols-\[1\.2fr_\.8fr\]{
    grid-template-columns: 1.2fr .8fr;
  }

  .lg\:p-12{
    padding: 3rem;
  }

  .lg\:px-10{
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }
}

@media (min-width: 1280px){
  .xl\:block{
    display: block;
  }
}
